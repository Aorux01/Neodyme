<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password - Neodyme</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body data-page="reset-password">
    <a href="/login" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Sign In
    </a>

    <div class="login-container">
        <div class="login-sidebar">
            <div class="sidebar-content">
                <div class="neodyme-logo-large">N</div>
                <h1 class="sidebar-title">Neodyme Server</h1>
                <p class="sidebar-subtitle">Pick a strong password you have not used elsewhere</p>
            </div>
        </div>

        <div class="login-form-container">
            <div class="form-header">
                <h2 class="form-title">Choose a New Password</h2>
                <p class="form-subtitle">This link works once and expires soon</p>
            </div>

            <div class="alert alert-error" id="alert">
                <span id="alert-message"></span>
            </div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="password" class="form-label">New Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter a new password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm" class="form-input" placeholder="Repeat the new password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn" data-original-text="UPDATE PASSWORD">UPDATE PASSWORD</button>
            </form>

            <div class="signup-link">
                Need a new link? <a href="/forgot-password">Request one</a>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/recovery.js"></script>
</body>
</html>
