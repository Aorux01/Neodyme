<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Neodyme</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body data-page="forgot-password">
    <a href="/login" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Sign In
    </a>

    <div class="login-container">
        <div class="login-sidebar">
            <div class="sidebar-content">
                <div class="neodyme-logo-large">N</div>
                <h1 class="sidebar-title">Neodyme Server</h1>
                <p class="sidebar-subtitle">Get back into your account</p>
            </div>
        </div>

        <div class="login-form-container">
            <div class="form-header">
                <h2 class="form-title">Forgot Password</h2>
                <p class="form-subtitle">We will email you a link to choose a new password</p>
            </div>

            <div class="alert alert-error" id="alert">
                <span id="alert-message"></span>
            </div>

            <div class="alert alert-info" id="feature-notice" style="display:none;"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required autocomplete="email">
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn" data-original-text="SEND RESET LINK">SEND RESET LINK</button>
            </form>

            <div class="signup-link">
                Remembered it? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/recovery.js"></script>
</body>
</html>
